<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thank You | AlloStudy</title>
<style>
:root{--bg:#f4f7fb;--card:#ffffff;--text:#14213a;--muted:#6a7a92;--brand:#1F3A5F;--accent:#2EC4B6;--gold:#F5A623;--line:#e2e9f3;--btn:#229ED9;--btn-text:#ffffff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1727;--card:#162238;--text:#eef3fa;--muted:#9db0c9;--brand:#6c9ad8;--line:#25354f}}
:root[data-theme="dark"]{--bg:#0e1727;--card:#162238;--text:#eef3fa;--muted:#9db0c9;--brand:#6c9ad8;--line:#25354f}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 18px}
.card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:40px 26px 30px;text-align:center;box-shadow:0 20px 50px rgba(20,33,58,.10)}
.art{width:170px;height:150px;margin:0 auto 18px;display:block}
h1{margin:0 0 8px;font-size:28px;letter-spacing:-.02em}
p{margin:0 0 26px;color:var(--muted);font-size:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--btn);color:var(--btn-text);text-decoration:none;font-weight:700;font-size:17px;padding:16px 20px;border-radius:16px;box-shadow:0 10px 24px rgba(34,158,217,.35);transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn svg{width:22px;height:22px;flex:none}
.small{margin-top:18px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main class="card">
  <svg class="art" viewBox="0 0 170 150" role="img" aria-label="Shopping cart with dollar coins">
    <circle cx="85" cy="78" r="62" fill="#2EC4B6" opacity=".16"/>
    <path d="M18 30h20l14 62h70l14-48H46" fill="none" stroke="#1F3A5F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M46 44h92l-12 48H52z" fill="#1F3A5F" opacity=".12"/>
    <circle cx="66" cy="115" r="9" fill="#1F3A5F"/><circle cx="118" cy="115" r="9" fill="#1F3A5F"/>
    <circle cx="92" cy="30" r="24" fill="#F5A623" stroke="#d98a0f" stroke-width="4"/>
    <text x="92" y="41" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="800" fill="#fff">$</text>
    <circle cx="140" cy="62" r="14" fill="#F5A623" stroke="#d98a0f" stroke-width="3"/>
    <text x="140" y="68" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#fff">$</text>
    <circle cx="48" cy="60" r="11" fill="#F5A623" stroke="#d98a0f" stroke-width="3"/>
    <text x="48" y="65" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#fff">$</text>
  </svg>
  <h1>Thank you!</h1>
  <p>Your order was received. Confirm your purchase on Telegram to get your product.</p>
  <a class="btn" target="_blank" rel="noopener" href="https://t.me/PREMIUM_SELLER_MG?text=Hello%21%20I%20just%20made%20a%20purchase%20and%20I%20would%20like%20to%20confirm%20my%20order.%20Product%3A%20">
    <svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M21.9 4.1 2.6 11.5c-.9.3-.9 1.3 0 1.6l4.9 1.5 1.9 5.8c.2.6 1 .8 1.4.3l2.7-2.5 5 3.7c.6.4 1.4.1 1.6-.6L23.3 5.6c.2-.9-.6-1.8-1.4-1.5zM9.5 14.1l9-5.6-7 6.7-.3 3.1z"/></svg>
    Confirm purchase on Telegram
  </a>
  <div class="small">Support available on Telegram</div>
</main>
</body>
</html>
